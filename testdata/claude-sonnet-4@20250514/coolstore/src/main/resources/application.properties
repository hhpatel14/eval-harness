# Quarkus Configuration
# Database configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=coolstore
quarkus.datasource.password=coolstore
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/coolstore

# Hibernate ORM configuration
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.sql-load-script=no-file

# Flyway configuration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# Messaging configuration for reactive messaging
# Inventory notifications channel
mp.messaging.incoming.inventory-notifications.connector=smallrye-amqp
mp.messaging.incoming.inventory-notifications.address=topic://inventory
mp.messaging.incoming.inventory-notifications.durable=true

# Order topic channel
mp.messaging.incoming.order-topic.connector=smallrye-amqp
mp.messaging.incoming.order-topic.address=topic://orders
mp.messaging.incoming.order-topic.durable=true

# AMQP broker configuration
amqp-host=localhost
amqp-port=5672
amqp-username=admin
amqp-password=admin